<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1c2a3a"/>
      <stop offset="0.6" stop-color="#0c131c"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b0"/>
      <stop offset="0.35" stop-color="#f5c542"/>
      <stop offset="0.7" stop-color="#c58a12"/>
      <stop offset="1" stop-color="#f2c94c"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.5" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#b9800f"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a4a"/>
      <stop offset="1" stop-color="#0b3d22"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path id="shieldInner" d="M512 232 C600 262 690 268 770 262 C770 470 748 640 512 800 C276 640 254 470 254 262 C334 268 424 262 512 232 Z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="520" r="470" fill="url(#glow)"/>
  <!-- rays -->
  <g opacity="0.10" stroke="#f5c542" stroke-width="10">
    <line x1="512" y1="520" x2="512" y2="20"/><line x1="512" y1="520" x2="140" y2="90"/>
    <line x1="512" y1="520" x2="884" y2="90"/><line x1="512" y1="520" x2="20" y2="330"/>
    <line x1="512" y1="520" x2="1004" y2="330"/>
  </g>
  <!-- shield -->
  <g filter="url(#shadow)">
    <path d="M512 196 C610 232 706 240 800 232 C800 470 772 672 512 850 C252 672 224 470 224 232 C318 240 414 232 512 196 Z" fill="url(#gold)"/>
    <path d="M512 214 C606 248 700 256 782 248 C782 462 756 654 512 826 C268 654 242 462 242 248 C324 256 418 248 512 214 Z" fill="#7a5208" opacity="0.55"/>
  </g>
  <path d="M512 232 C600 262 690 268 770 262 C770 470 748 640 512 800 C276 640 254 470 254 262 C334 268 424 262 512 232 Z" fill="url(#pitch)"/>
  <g clip-path="url(#shieldClip)" stroke="#fff" stroke-opacity="0.28" stroke-width="7" fill="none">
    <line x1="230" y1="470" x2="800" y2="470"/>
    <circle cx="512" cy="470" r="118"/>
    <rect x="360" y="230" width="304" height="90"/>
  </g>
  <g clip-path="url(#shieldClip)" opacity="0.18">
    <rect x="230" y="230" width="600" height="60" fill="#fff"/><rect x="230" y="350" width="600" height="60" fill="#fff"/>
    <rect x="230" y="590" width="600" height="60" fill="#fff"/><rect x="230" y="710" width="600" height="60" fill="#fff"/>
  </g>
  <!-- gloss -->
  <path d="M254 262 C334 268 424 262 512 232 C600 262 690 268 770 262 C770 330 766 380 758 420 C640 380 380 380 266 420 C258 380 254 330 254 262 Z" fill="#fff" opacity="0.10"/>
  <!-- FL monogram -->
  <g font-family="Impact, 'Arial Black', 'DejaVu Sans', sans-serif" font-weight="900" text-anchor="middle">
    <text x="512" y="562" font-size="270" fill="#000" opacity="0.45" transform="translate(6 10)">FL</text>
    <text x="512" y="562" font-size="270" fill="url(#goldText)" stroke="#7a5208" stroke-width="5" letter-spacing="-8">FL</text>
  </g>
  <!-- stars -->
  <g fill="url(#goldText)" stroke="#7a5208" stroke-width="3">
    <path id="s" d="M0 -34 L10 -11 L35 -9 L16 7 L22 32 L0 19 L-22 32 L-16 7 L-35 -9 L-10 -11 Z" transform="translate(512 655)"/>
    <path d="M0 -26 L8 -8 L27 -7 L12 5 L17 24 L0 14 L-17 24 L-12 5 L-27 -7 L-8 -8 Z" transform="translate(432 640)"/>
    <path d="M0 -26 L8 -8 L27 -7 L12 5 L17 24 L0 14 L-17 24 L-12 5 L-27 -7 L-8 -8 Z" transform="translate(592 640)"/>
  </g>
  <!-- crown -->
  <g filter="url(#shadow)">
    <path d="M392 208 L420 96 L470 158 L512 70 L554 158 L604 96 L632 208 Q512 236 392 208 Z" fill="url(#gold)" stroke="#7a5208" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="420" cy="92" r="16" fill="#fff1b0"/><circle cx="512" cy="64" r="18" fill="#fff1b0"/><circle cx="604" cy="92" r="16" fill="#fff1b0"/>
    <rect x="396" y="196" width="232" height="16" rx="6" fill="#c58a12"/>
  </g>
  <!-- outer sparkle -->
  <g fill="#fff6c8" opacity="0.9">
    <path d="M150 160 l10 28 28 10 -28 10 -10 28 -10 -28 -28 -10 28 -10z"/>
    <path d="M870 700 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z"/>
  </g>
</svg>
